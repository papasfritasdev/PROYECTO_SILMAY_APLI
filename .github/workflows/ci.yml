name: SILMAY Monorepo CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Verificación de Reglas de Oro y Guardrails de Arquitectura Limpia
  # ----------------------------------------------------------------------------
  architecture-guardrails:
    name: Clean Architecture Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Verificar regla de cero secretos versionados
        run: |
          echo "Verificando que no existan secretos versionados..."
          if git ls-files | grep -E '(\.env|google-services\.json|service-account-key\.json)'; then
            echo "::error::Se detectaron archivos de credenciales o .env versionados en Git."
            exit 1
          fi
          echo "Política de Cero Secretos: OK"

      - name: Verificar independencia de frameworks en capa Domain (Android)
        run: |
          echo "Verificando imports prohibidos en ec.silmay.app.domain..."
          DOMAIN_DIR="android/app/src/main/java/ec/silmay/app/domain"
          if [ -d "$DOMAIN_DIR" ]; then
            FORBIDDEN_IMPORTS=$(grep -rnE 'import (android\.|androidx\.compose\.|com\.google\.firebase\.)' "$DOMAIN_DIR" || true)
            if [ -n "$FORBIDDEN_IMPORTS" ]; then
              echo "::error::Clean Architecture violada. La capa domain contiene imports prohibidos:"
              echo "$FORBIDDEN_IMPORTS"
              exit 1
            fi
          fi
          echo "Guardrail Clean Architecture Domain: OK"

      - name: Verificar independencia de frameworks en capa Domain (Web)
        run: |
          echo "Verificando imports prohibidos en web/src/domain..."
          WEB_DOMAIN_DIR="web/src/domain"
          if [ -d "$WEB_DOMAIN_DIR" ]; then
            FORBIDDEN_IMPORTS=$(grep -rnE "from ['\"](react|react-dom|react-router-dom|firebase)" "$WEB_DOMAIN_DIR" --include=*.ts --include=*.tsx | grep -v '\.test\.ts' || true)
            if [ -n "$FORBIDDEN_IMPORTS" ]; then
              echo "::error::Clean Architecture violada. web/src/domain contiene imports prohibidos:"
              echo "$FORBIDDEN_IMPORTS"
              exit 1
            fi
          fi
          echo "Guardrail Clean Architecture Domain Web: OK"

  # ----------------------------------------------------------------------------
  # Job 2: Microservicios Backend Serverless (Firebase Functions)
  # ----------------------------------------------------------------------------
  functions-ci:
    name: Backend Functions (Node.js)
    needs: architecture-guardrails
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Verificar si Functions está inicializado
        id: check-functions
        run: |
          if [ -f "package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Configurar Node.js 20 LTS
        if: steps.check-functions.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Instalar dependencias
        if: steps.check-functions.outputs.exists == 'true'
        run: npm ci

      - name: Compilar TypeScript
        if: steps.check-functions.outputs.exists == 'true'
        run: npm run build

      - name: Ejecutar pruebas unitarias
        if: steps.check-functions.outputs.exists == 'true'
        run: npm test

  # ----------------------------------------------------------------------------
  # Job 3: Aplicación Móvil Android (Kotlin / Jetpack Compose)
  # ----------------------------------------------------------------------------
  android-ci:
    name: Mobile Android (Kotlin)
    needs: architecture-guardrails
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Verificar si Android está inicializado
        id: check-android
        run: |
          if [ -f "gradlew" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Configurar JDK 17
        if: steps.check-android.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generar google-services.json placeholder para compilación en CI
        if: steps.check-android.outputs.exists == 'true'
        run: |
          mkdir -p app
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "silmay-dev",
              "storage_bucket": "silmay-dev.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef123456",
                  "android_client_info": {
                    "package_name": "ec.silmay.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyFakeDevApiKeyForEmulators12345"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Permisos de ejecución en Gradle Wrapper
        if: steps.check-android.outputs.exists == 'true'
        run: chmod +x ./gradlew

      - name: Ejecutar pruebas unitarias de Android
        if: steps.check-android.outputs.exists == 'true'
        run: ./gradlew testDebugUnitTest --no-daemon

  # ----------------------------------------------------------------------------
  # Job 4: Plataforma Web Administrativa (React / Vite)
  # ----------------------------------------------------------------------------
  web-ci:
    name: Web React Platform
    needs: architecture-guardrails
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Verificar si Web está inicializado
        id: check-web
        run: |
          if [ -f "package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Configurar Node.js 20 LTS
        if: steps.check-web.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        if: steps.check-web.outputs.exists == 'true'
        run: npm ci

      - name: Ejecutar pruebas unitarias Web
        if: steps.check-web.outputs.exists == 'true'
        run: npm test

      - name: Compilar Web App
        if: steps.check-web.outputs.exists == 'true'
        run: npm run build
